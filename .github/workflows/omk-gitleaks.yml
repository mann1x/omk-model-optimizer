# omk: secret scan of every commit omk adds on top of NVIDIA/Model-Optimizer (omk/gitleaks.toml), on every push to
# omk branches and on PRs into them. Upstream's own history is not ours to rewrite and is not scanned: the range
# is NVIDIA main..HEAD, so merged upstream commits stay out of it.
# The gitleaks binary is pinned and checked against the release's own checksum file.
name: omk-gitleaks
on:
  push:
    branches: [omk-main, "omk/**"]
  pull_request:
    branches: [omk-main, "omk/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          V=8.30.1
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
      - name: Fetch NVIDIA/Model-Optimizer main (the range base)
        run: git fetch --no-tags https://github.com/NVIDIA/Model-Optimizer.git main:refs/remotes/upstream/main
      - name: Scan omk commits (upstream/main..HEAD)
        run: ./gitleaks git . --no-banner --redact --verbose --config omk/gitleaks.toml --log-opts="upstream/main..HEAD"
